[pytest]
pythonpath = .
testpaths = tests
norecursedirs = future .venv
filterwarnings =
    # Filter only specific upstream third-party deprecation warnings;
    # all warnings from our own codebase remain active.
    ignore:distutils Version classes are deprecated.*:DeprecationWarning:oslo_config.*
    ignore:distutils Version classes are deprecated.*:DeprecationWarning:ryu\.lib\.packet\.zebra
    ignore:the imp module is deprecated in favour of importlib.*:DeprecationWarning:eventlet\.patcher
    ignore:distutils Version classes are deprecated.*:DeprecationWarning:eventlet\.support\.greenlets
    ignore:dns\.hash module will be removed in future versions.*:DeprecationWarning:dns\.hash
    ignore:Using or importing the ABCs from 'collections'.*:DeprecationWarning:dns\.namedict
